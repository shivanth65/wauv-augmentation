# Paths are relative to this file. Real images need no label files.
input_dir: input
review_dir: review
approved_dir: approved
output_dir: output
classes: [gate_sos, gate_hammer]
output_format: obb
image_size: 640
images_per_input: 10
seed: 42
orientation_sensitive_classes: [] # Class names; disables rotation/aspect/perspective.
detector:
  weights: null # Local custom Ultralytics detection/OBB .pt file; never downloaded.
  class_map: {} # Optional model-name: configured-class-name mapping.
  confidence: 0.25
  low_confidence: 0.5
  iou: 0.5
geometry:
  attempts: 30
  min_side: 2
  allow_crop: false
  min_visibility: 0.9
  max_obb_area_ratio: 1.15
augmentation:
  rotation: {enabled: true, probability: 0.7, limit: 20}
  translation: {enabled: true, probability: 0.5, limit: 0.10}
  scaling: {enabled: true, probability: 0.7, min: 0.6, max: 1.4}
  aspect_ratio: {enabled: true, probability: 0.4, min: 0.9, max: 1.1}
  perspective: {enabled: false, probability: 0.2, limit: 0.02}
  brightness: {enabled: true, probability: 0.6, min: 0.7, max: 1.3}
  contrast: {enabled: true, probability: 0.5, min: 0.8, max: 1.2}
  gamma: {enabled: true, probability: 0.4, min: 0.8, max: 1.2}
  uneven_lighting: {enabled: true, probability: 0.4, strength: 0.2}
  vignette: {enabled: true, probability: 0.3, strength: 0.25}
  shadows: {enabled: true, probability: 0.4, strength: 0.25}
  underwater_tint: {enabled: true, probability: 0.8, strength: 0.25}
  haze: {enabled: true, probability: 0.4, strength: 0.18}
  blur: {enabled: true, probability: 0.3, max_sigma: 2}
  noise: {enabled: true, probability: 0.3, strength: 0.015}
  grain: {enabled: true, probability: 0.2, strength: 0.008}
  motion_blur: {enabled: false, probability: 0.2, kernel: 5}
  jpeg: {enabled: false, probability: 0.2, min: 80, max: 95}
